version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"

