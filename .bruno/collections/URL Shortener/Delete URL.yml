info:
  name: Delete URL
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{BASE_URL}}/{{url_id}}"
  headers:
    - name: X-Delete-Key
      value: "{{delete_key}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
